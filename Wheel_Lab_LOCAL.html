<section id="about" class="view narrow" hidden><div class="intro"><span class="eyebrow">WHEEL LAB</span><h1 data-i18n="application"></h1></div><div class="panel"><div id="appInfo"></div><div class="toolbar"><button id="install" data-i18n="install"></button><button id="checkUpdate" data-i18n="checkUpdate"></button></div><p id="updateStatus" class="small muted" aria-live="polite"></p></div><div class="panel spaced"><h2 data-i18n="howTo"></h2><p data-i18n="howToText"></p></div></section>

<div id="adminContent" hidden><div class="admin-banner"><span data-i18n="adminLocal"></span><button id="logout" data-i18n="logout"></button></div><div class="admin-tabs"><button data-admin="wheels" data-i18n="wheels"></button><button data-admin="seasons" data-i18n="seasons"></button><button data-admin="people" data-i18n="players"></button><button data-admin="backup" data-i18n="backup"></button></div><div id="adminBody"></div></div></section>
</main><footer class="shell"><span id="versionFooter"></span><span class="footer-links"><span id="saveStatus"></span><button data-view="admin" class="link" data-i18n="admin"></button></span></footer>

function renderWheelAdmin(){const s=editSeason();const w=s.wheels.find(w=>w.id===selectedWheelId)||s.wheels[0];selectedWheelId=w?.id;if(!editor||editor.id!==w?.id)editor=E.clone(w);$('adminBody').innerHTML=`<div class="toolbar"><label>${t('season')}<select id="editSeason">${state.config.seasons.map(s=>`<option value="${esc(s.id)}" ${s.id===editSeason().id?'selected':''}>${esc(name(s))}</option>`).join('')}</select></label><button id="addWheel">+ ${t('addWheel')}</button><button id="testSeason">▷ ${t('testMode')}</button></div><div class="admin-grid"><div class="wheel-nav">${s.wheels.map(w=>`<button data-wheel="${esc(w.id)}" class="${w.id===selectedWheelId?'active':''}">${w.enabled?'':'○ '}${esc(name(w))}${w.mode!=='main'?' ↳':''}</button>`).join('')}</div><div class="panel" id="wheelEditor"></div></div>`;$('editSeason').onchange=e=>{if(leaveEditor()){editSeasonId=e.target.value;renderWheelAdmin()}else e.target.value=s.id};document.querySelectorAll('[data-wheel]').forEach(b=>b.onclick=()=>{if(leaveEditor()){selectedWheelId=b.dataset.wheel;renderWheelAdmin()}});$('addWheel').onclick=()=>{if(!leaveEditor())return;const nw={id:'custom_'+E.id(),pl:'Nowe koło',en:'New wheel',color:'#a78bfa',mode:'main',source:'',triggers:[],enabled:true,options:[{id:E.id(),pl:'Opcja 1',en:'Option 1',chance:50,enabled:true},{id:E.id(),pl:'Opcja 2',en:'Option 2',chance:50,enabled:true}]};if(commit(()=>{s.wheels.push(nw);s.revision++})){selectedWheelId=nw.id;renderWheelAdmin()}};$('testSeason').onclick=()=>{if(!leaveEditor())return;testCharacter=E.newCharacter(editSeason(),'TEST','ADMIN','test');setView('play')};renderEditor()}
function renderEditor(){const w=editor;if(!w)return;const s=editSeason();$('wheelEditor').innerHTML=`<form id="wheelForm"><div class="row"><span class="eyebrow">${esc(w.id)}</span><label class="check"><input id="wheelEnabled" type="checkbox" ${w.enabled?'checked':''}>${t('enabled')}</label></div><div class="editor-top"><label>${t('namePL')}<input id="wheelPL" required maxlength="100" value="${esc(w.pl)}"></label><label>${t('nameEN')}<input id="wheelEN" required maxlength="100" value="${esc(w.en)}"></label><label>${t('color')}<input id="wheelColor" type="color" value="${esc(w.color)}"></label></div><p class="help">${t('editorHint')}</p><details><summary>${t('condition')} · ${t(w.mode==='pool'?'poolMode':w.mode==='branch'?'branchMode':'mainMode')}</summary><p class="help">${t('engineHint')}</p><div class="editor-rule"><label>${t('condition')}<select id="wheelSource"><option value="">${t('always')}</option>${s.wheels.filter(x=>x.mode==='main'&&x.id!==w.id).map(x=>`<option value="${esc(x.id)}" ${w.source===x.id?'selected':''}>${esc(name(x))}</option>`).join('')}</select></label><label>${t('triggers')}<select id="wheelTriggers" multiple>${(s.wheels.find(x=>x.id===w.source)?.options||[]).map(o=>`<option value="${esc(o.id)}" ${w.triggers.includes(o.id)?'selected':''}>${esc(name(o))}</option>`).join('')}</select></label></div></details><div class="option-row option-header"><span>✓</span><span>POLSKI</span><span>ENGLISH</span><span>%</span><span></span></div><div id="optionRows">${w.options.map((o,i)=>optionRow(o,i)).join('')}</div><div class="toolbar"><button type="button" id="addOption">+ ${t('addOption')}</button><button type="button" id="normalize">${t('normalize')}</button></div><div id="editErrors" class="validation" role="alert"></div><div class="sticky-save"><div class="row"><span id="chanceSum" class="sum"></span><button class="primary" type="submit">${t('save')}</button></div></div><div class="toolbar"><button type="button" id="moveUp">↑ ${t('moveUp')}</button><button type="button" id="moveDown">↓ ${t('moveDown')}</button><button type="button" id="deleteWheel" class="danger">${t('deleteWheel')}</button></div></form>`;
$('wheelPL').oninput=e=>{editor.pl=e.target.value;editorDirty=true};$('wheelEN').oninput=e=>{editor.en=e.target.value;editorDirty=true};$('wheelColor').oninput=e=>{editor.color=e.target.value;editorDirty=true};$('wheelEnabled').onchange=e=>{editor.enabled=e.target.checked;editorDirty=true};$('wheelSource').disabled=w.mode==='pool';$('wheelSource').onchange=e=>{editor.source=e.target.value;editor.triggers=[];editorDirty=true;if(editor.mode==='branch'&&!editor.source)editor.mode='main';renderEditor()};$('wheelTriggers').onchange=e=>{editor.triggers=[...e.target.selectedOptions].map(o=>o.value);editorDirty=true};
$('optionRows').oninput=e=>{const el=e.target,row=el.closest('[data-option]');if(!row)return;const o=editor.options[Number(row.dataset.option)],f=el.dataset.field;if(!f)return;o[f]=['chance','count'].includes(f)?Number(el.value):['enabled','requiresPower'].includes(f)?el.checked:el.value;if(f==='grant'&&!o.grant)delete o.grant;editorDirty=true;updateSum()};$('optionRows').onchange=$('optionRows').oninput;
$('optionRows').onclick=e=>{const b=e.target.closest('[data-remove]');if(!b)return;editor.options.splice(Number(b.dataset.remove),1);editorDirty=true;renderEditor()};$('addOption').onclick=()=>{editor.options.push({id:E.id(),pl:'',en:'',chance:0,enabled:true,...(editor.id==='power_count'?{count:1}:{})});editorDirty=true;renderEditor();$('optionRows').lastElementChild?.querySelector('.name-pl')?.focus()};$('normalize').onclick=()=>{try{E.normalize(editor.options);editorDirty=true;renderEditor()}catch(e){$('editErrors').textContent=e.message}};$('wheelForm').onsubmit=e=>{e.preventDefault();saveEditor()};$('deleteWheel').onclick=()=>{if(!confirm(t('deleteConfirm')))return;const candidate=E.clone(s);candidate.wheels=candidate.wheels.filter(x=>x.id!==w.id);const errors=E.validateSeason(candidate);if(errors.length){$('editErrors').textContent=errors.join('\n');return}if(commit(()=>{s.wheels=candidate.wheels;s.revision++})){editor=null;editorDirty=false;selectedWheelId=s.wheels[0].id;renderWheelAdmin()}};for(const [id,dir]of[['moveUp',-1],['moveDown',1]])$(id).onclick=()=>{if(editorDirty&&!saveEditor(false))return;const ss=editSeason(),i=ss.wheels.findIndex(x=>x.id===w.id),j=i+dir;if(j<0||j>=ss.wheels.length)return;const candidate=E.clone(ss);[candidate.wheels[i],candidate.wheels[j]]=[candidate.wheels[j],candidate.wheels[i]];const errors=E.validateSeason(candidate);if(errors.length){$('editErrors').textContent=errors.join('\n');return}if(commit(()=>{ss.wheels=candidate.wheels;ss.revision++})){editor=null;renderWheelAdmin()}};updateSum()}
function optionRow(o,i){const ps=editSeason().wheels.find(w=>w.id==='powers')?.options||[];return `<div class="option-row" data-option="${i}"><input type="checkbox" data-field="enabled" aria-label="${t('enabled')} ${i+1}" ${o.enabled!==false?'checked':''}><input class="name-pl" data-field="pl" required maxlength="100" aria-label="PL ${i+1}" placeholder="Polski" value="${esc(o.pl)}"><input class="name-en" data-field="en" required maxlength="100" aria-label="EN ${i+1}" placeholder="English" value="${esc(o.en)}"><input class="chance" data-field="chance" type="number" min="0" max="100" step="any" required aria-label="% ${i+1}" value="${o.chance}"><button type="button" class="remove danger" data-remove="${i}" aria-label="${t('remove')} ${i+1}">×</button><details class="option-extra"><summary>${t('advanced')}</summary><div class="editor-rule"><label>${t('grant')}<select data-field="grant"><option value="">${t('none')}</option>${ps.map(p=>`<option value="${esc(p.id)}" ${o.grant===p.id?'selected':''}>${esc(name(p))}</option>`).join('')}</select></label>${editor.id==='power_count'?`<label>${t('powerCount')}<input type="number" min="0" max="5" step="1" value="${o.count??0}" data-field="count"></label>`:''}${editor.id==='weakness'?`<label class="check"><input type="checkbox" data-field="requiresPower" ${o.requiresPower?'checked':''}>${t('needsPower')}</label>`:''}</div></details></div>`}
function updateSum(){const sum=editor.options.filter(o=>o.enabled!==false).reduce((a,o)=>a+(Number(o.chance)||0),0);$('chanceSum').textContent=t('total')+': '+sum.toFixed(4).replace(/0+$/,'').replace(/\.$/,'')+'%';$('chanceSum').classList.toggle('bad',Math.abs(sum-100)>.0001)}
function saveEditor(redraw=true){const s=editSeason(),candidate=E.clone(s),i=candidate.wheels.findIndex(w=>w.id===editor.id);candidate.wheels[i]=E.clone(editor);const errors=E.validateSeason(candidate);if(errors.length){$('editErrors').textContent=errors.join('\n');return false}if(!commit(()=>{s.wheels=candidate.wheels;s.revision++}))return false;editorDirty=false;editor=null;notify(t('changesSaved'));if(redraw)renderWheelAdmin();return true}
function renderSeasons(){$('adminBody').innerHTML=`<div class="panel"><p class="help">${t('seasonHint')}</p>${state.config.seasons.map(s=>`<div class="season-card" data-season="${esc(s.id)}"><div class="row"><span class="eyebrow">${esc(s.id)} · r${s.revision}</span>${s.id===state.config.activeSeason?`<span class="badge">${t('active')}</span>`:''}</div><div class="editor-top"><label>${t('namePL')}<input data-season-pl required maxlength="100" value="${esc(s.pl)}"></label><label>${t('nameEN')}<input data-season-en required maxlength="100" value="${esc(s.en)}"></label></div><div class="toolbar"><button data-season-action="rename">${t('save')}</button><button data-season-action="clone">${t('cloneSeason')}</button><button data-season-action="activate" ${s.id===state.config.activeSeason?'disabled':''}>${t('activate')}</button><button data-season-action="delete" class="danger" ${state.config.seasons.length<2||s.id===state.config.activeSeason?'disabled':''}>${t('remove')}</button></div></div>`).join('')}</div>`;$('adminBody').onclick=e=>{const b=e.target.closest('[data-season-action]');if(!b)return;const row=b.closest('[data-season]'),s=state.config.seasons.find(s=>s.id===row.dataset.season),pl=row.querySelector('[data-season-pl]').value.trim(),en=row.querySelector('[data-season-en]').value.trim();if(!pl||!en){notify(t('namePL')+' / '+t('nameEN'));return}const action=b.dataset.seasonAction;if(action==='delete'&&!confirm(t('deleteConfirm')))return;if(commit(()=>{if(action==='rename'){s.pl=pl;s.en=en;s.revision++}if(action==='clone'){const cp=E.clone(s);cp.id='season-'+E.id();cp.pl=pl+' · Kopia';cp.en=en+' · Copy';cp.revision=1;state.config.seasons.push(cp)}if(action==='activate')state.config.activeSeason=s.id;if(action==='delete')state.config.seasons=state.config.seasons.filter(x=>x.id!==s.id)})){editSeasonId=state.config.activeSeason;localize();renderSeasons();notify(t('settingsSaved'))}}}
function renderPeople(){const activeId=state.config.activeSeason;$('adminBody').innerHTML=`<div class="panel"><form id="limitForm"><div class="editor-rule"><label>${t('defaultLimit')}<input id="defaultLimit" type="number" min="0" max="1000" step="1" required value="${setting('limit')}"></label><label>${t('waitSeconds')}<input id="cooldown" type="number" min="0" max="86400" step="1" required value="${setting('cooldown')}"></label></div><button type="submit">${t('save')}</button></form><p class="help">${t('guestHint')}</p><div class="toolbar"><input id="newGuestName" maxlength="40" placeholder="${t('newName')}"><button id="newGuest">${t('newGuest')}</button></div>${state.guests.map(g=>{const q=quota(g);return `<div class="people-row" data-guest="${esc(g.id)}"><span><strong>${esc(g.name)}</strong>${g.id===state.guestId?' ●':''}<br><span class="small muted">${t('used')}: ${q.used} / ${q.limit}</span></span><div class="inline"><label>${t('limit')}<input type="number" min="0" max="1000" step="1" data-guest-limit value="${g.limit??''}" placeholder="${t('default')}"></label><label class="check"><input data-guest-block type="checkbox" ${g.blocked?'checked':''}>${t('block')}</label><button data-guest-save>${t('save')}</button><button data-guest-use>${t('useGuest')}</button></div></div>`}).join('')}</div><div class="panel spaced"><h2>${t('characters')}</h2>${state.characters.map(c=>`<div class="people-row"><span>${esc(c.name)} · ${esc(c.owner)} <span class="small muted">${esc(name(c.season))} ${c.deleted?' / '+t('deleted'):''}</span></span><div class="inline"><button data-admin-card="${esc(c.id)}">${t('details')}</button><button data-char-toggle="${esc(c.id)}">${t(c.deleted?'restoreChar':'remove')}</button></div></div>`).join('')}</div>`;$('limitForm').onsubmit=e=>{e.preventDefault();if(commit(()=>{state.config.settings.limit=Number($('defaultLimit').value);state.config.settings.cooldown=Number($('cooldown').value)}))notify(t('settingsSaved'))};$('newGuest').onclick=()=>{const n=$('newGuestName').value.trim();if(!n)return;if(commit(()=>state.guests.push({id:E.id(),name:n,limit:null,blocked:false})))renderPeople()};$('adminBody').onclick=e=>{const b=e.target.closest('button');if(!b)return;const row=b.closest('[data-guest]');if(row){const g=state.guests.find(g=>g.id===row.dataset.guest);if(b.hasAttribute('data-guest-save')){const inp=row.querySelector('[data-guest-limit]');if(!inp.reportValidity())return;if(commit(()=>{g.limit=inp.value===''?null:Number(inp.value);g.blocked=row.querySelector('[data-guest-block]').checked}))renderPeople()}if(b.hasAttribute('data-guest-use')){commit(()=>{state.guestId=g.id;state.currentId=null});testCharacter=null;setView('play')}}if(b.dataset.adminCard)showCard(state.characters.find(c=>c.id===b.dataset.adminCard));if(b.dataset.charToggle){const c=state.characters.find(c=>c.id===b.dataset.charToggle);if(commit(()=>{c.deleted=!c.deleted;if(c.deleted&&state.currentId===c.id)state.currentId=null}))renderPeople()}}}
let importType='';function renderBackup(){$('adminBody').innerHTML=`<div class="panel"><h2>${t('backup')}</h2><p class="help">${t('backupHint')}</p><div class="toolbar"><button id="exportAll">${t('exportAll')}</button><button data-import="backup">${t('restore')}</button><button data-import="characters">${t('importChars')}</button></div><div class="toolbar"><button id="exportConfig">${t('exportConfig')}</button><button data-import="config">${t('importConfig')}</button><button id="deployConfig">${t('deployConfig')}</button><button id="bundledConfig">${t('bundled')}</button>${readOnly?`<button id="rawExport">${t('rawExport')}</button>`:''}</div><p class="help">${t('adminLocal')}</p></div>`;$('exportAll').onclick=()=>download('Wheel_Lab_backup.json',{schema:2,type:'backup',state});$('exportConfig').onclick=()=>download('Wheel_Lab_seasons.json',{schema:2,type:'config',config:state.config});$('deployConfig').onclick=()=>download('data.js','globalThis.WL_DEFAULTS = '+JSON.stringify({schema:2,appVersion:VERSION,...state.config},null,2)+';\n',true);$('bundledConfig').onclick=()=>{if(!confirm(t('restoreConfirm')))return;if(commit(()=>state.config=E.clone({activeSeason:D.activeSeason,seasons:D.seasons,settings:D.settings}))){editSeasonId=state.config.activeSeason;editor=null;localize();renderAdmin();notify(t('settingsSaved'))}};if($('rawExport'))$('rawExport').onclick=()=>download('Wheel_Lab_raw.json',rawData||'',true);document.querySelectorAll('[data-import]').forEach(b=>b.onclick=()=>{importType=b.dataset.import;$('importFile').click()})}
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>15*1024*1024)throw Error('Max 15 MB');const data=JSON.parse(await f.text());if(data.schema!==2||data.type!==importType)throw Error(t('invalid'));if(importType==='backup'){if(!validState(data.state))throw Error(t('invalid'));if(!confirm(t('restoreConfirm')))return;const restored=E.clone(data.state);restored.rev=(state.rev||0)+1;if(storageAvailable)localStorage.setItem(KEY,JSON.stringify(restored));state=restored;readOnly=false;$('notice').hidden=true;testCharacter=null;editor=null;editSeasonId=state.config.activeSeason;localize();renderAdmin()}else if(importType==='config'){if(!validConfig(data.config))throw Error(t('invalid'));if(!confirm(t('restoreConfirm')))return;if(!commit(()=>state.config=E.clone(data.config)))return;editSeasonId=state.config.activeSeason;editor=null;localize();renderAdmin()}else{if(!Array.isArray(data.characters)||data.characters.length>2000||!data.characters.every(validCharacter))throw Error(t('invalid'));const ids=new Set(state.characters.map(c=>c.id));let n=0;if(!commit(()=>{for(const c of data.characters){if(!ids.has(c.id)){ids.add(c.id);state.characters.push(E.clone(c));n++}}}))return;notify(t('imported')+': '+n);return}notify(t('imported'))}catch(err){notify(t('invalid')+': '+err.message)}finally{e.target.value=''}};
