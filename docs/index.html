<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090e"><meta name="description" content="The Wheel of Shame — twórz postacie poprzez losowanie cech."><meta name="apple-mobile-web-app-title" content="The Wheel of Shame"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><title>The Wheel of Shame</title></head><body>
<header class="shell"><a class="brand" href="#play" aria-label="The Wheel of Shame"><span class="brand-icon"><span>✳</span><img id="brandImage" src="./media/logo.png" alt="" hidden></span><span class="brand-wordmark">THE WHEEL <strong>OF SHAME</strong></span></a><div class="header-right"><span id="seasonBadge" class="pill"></span><select id="language" aria-label="Language"><option value="pl">PL</option><option value="en">EN</option></select></div></header>
<div id="notice" class="shell notice" role="alert" hidden></div><div id="updateBanner" class="shell banner" hidden><span id="updateText"></span><button id="applyUpdate"></button></div>
<main class="shell"><nav><button data-view="play" data-i18n="create"></button><button data-view="collection" data-i18n="characters"></button><button data-view="about" data-i18n="application"></button></nav>
<section id="play" class="view"><div class="intro"><span class="eyebrow" data-i18n="introEyebrow"></span><h1 data-i18n="introTitle"></h1><p class="muted" data-i18n="introBody"></p></div>
<div id="musicControls" class="music-controls panel"><button id="musicToggle" type="button"></button><label class="music-volume"><span data-i18n="musicVolume"></span><input id="musicVolume" type="range" min="0" max="100" step="1" value="30"></label><span id="musicStatus" class="small muted" aria-live="polite"></span></div>
<div id="createPanel" class="setup panel"><form id="createForm"><label><span data-i18n="playerName"></span><input id="playerName" maxlength="40" required autocomplete="nickname" placeholder="Hariken"></label><label><span data-i18n="characterName"></span><input id="characterName" maxlength="40" required autocomplete="off" placeholder="Kael"></label><button class="primary" type="submit" data-i18n="begin"></button></form><div class="row"><p id="quota" class="small muted"></p><button id="resume" class="link" hidden data-i18n="resume"></button></div></div>
<div id="game" class="game" hidden><div class="wheel-stage"><div class="wheel-heading"><span id="category" class="category"></span><div id="wheelResult" aria-live="polite"></div><p id="wheelHint" class="small muted"></p></div><div class="wheel-holder"><canvas id="wheel" width="1000" height="1000" role="img"></canvas><div class="pointer"></div><div class="hub"><span>✦</span><img id="hubImage" src="./media/wheel-center.png" alt="" hidden></div></div><div class="spin-row"><button id="spin" class="primary large" data-i18n="spin"></button><button id="next" class="primary large" hidden data-i18n="next"></button><button id="finish" class="primary large" hidden data-i18n="finish"></button></div><div class="under-wheel"><label class="check"><input id="sound" type="checkbox"><span data-i18n="sound"></span></label><button id="testSound" class="link" data-i18n="testSound"></button><button id="poolToggle" class="link" data-i18n="odds"></button></div><div id="poolList" class="pool" hidden></div></div><aside class="character panel"><div class="row"><span class="eyebrow" data-i18n="yourCharacter"></span><span id="rollCount" class="pill"></span></div><h2 id="sheetName"></h2><p id="sheetOwner" class="small muted"></p><div id="sheetResults"></div><button id="pause" class="link" data-i18n="pause"></button></aside></div></section>
<section id="collection" class="view" hidden><div class="intro"><span class="eyebrow" data-i18n="collectionEyebrow"></span><h1 data-i18n="characters"></h1><p class="muted" data-i18n="collectionHint"></p></div><div class="toolbar"><input id="search" type="search"><select id="collectionSeason" aria-label="Season"></select><button id="exportCharacters" data-i18n="exportCharacters"></button></div><div id="cards" class="cards"></div></section>
<section id="about" class="view narrow" hidden><div class="intro"><span class="eyebrow">THE WHEEL OF SHAME</span><h1 data-i18n="application"></h1></div><div class="panel"><div id="appInfo"></div><div class="toolbar"><button id="install" data-i18n="install"></button><button id="checkUpdate" data-i18n="checkUpdate"></button></div><p id="updateStatus" class="small muted" aria-live="polite"></p></div><div class="panel spaced"><h2 data-i18n="howTo"></h2><p data-i18n="howToText"></p></div></section>
<section id="admin" class="view" hidden><div class="intro"><span class="eyebrow">CONTROL ROOM</span><h1 data-i18n="admin"></h1></div><form id="loginForm" class="panel login"><label><span data-i18n="username"></span><input id="loginName" autocomplete="username" required></label><label><span data-i18n="password"></span><input id="loginPass" type="password" autocomplete="current-password" required></label><button class="primary" type="submit" data-i18n="login"></button><p class="small muted" data-i18n="demoLogin"></p></form>
<div id="adminContent" hidden><div class="admin-banner"><span data-i18n="adminLocal"></span><button id="logout" data-i18n="logout"></button></div><div class="admin-tabs"><button data-admin="wheels" data-i18n="wheels"></button><button data-admin="seasons" data-i18n="seasons"></button><button data-admin="people" data-i18n="players"></button><button data-admin="backup" data-i18n="backup"></button></div><div id="adminBody"></div></div></section>
</main><footer class="shell"><span id="versionFooter"></span><span class="footer-links"><span id="saveStatus"></span><button data-view="admin" class="link" data-i18n="admin"></button></span></footer>
<div id="toast" role="status" hidden></div><dialog id="dialog"><div class="row"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="Close">×</button></div><div id="dialogBody"></div></dialog><input id="importFile" type="file" accept="application/json,.json" hidden>
<audio id="menuMusic" loop preload="none"></audio><script src="./audio.js"></script><script src="./data.js"></script><script src="./engine.js"></script><script src="./app.js"></script></body></html>
