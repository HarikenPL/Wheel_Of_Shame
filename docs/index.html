<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071219"><meta name="description" content="The Wheel of Shame — twórz postacie poprzez losowanie cech."><meta name="apple-mobile-web-app-title" content="The Wheel of Shame"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./landing.css"><link rel="stylesheet" href="./character-card.css"><link rel="stylesheet" href="./settings.css"><link rel="stylesheet" href="./theme.css"><title>The Wheel of Shame</title></head><body class="landing-open">
